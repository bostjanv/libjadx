openapi: 3.1.0
info:
  title: LibJadx API
  version: 0.1.0-experimental
  summary: Local REST API for one fixed Jadx project per process.
  description: >-
    Experimental contract. A process opens one project or one or more input files
    at startup. There are no upload, project-open, or project-switch operations.
servers:
  - url: http://127.0.0.1:18777/api/v1
    description: Default loopback listener
tags:
  - name: Service
  - name: Project
  - name: Symbols
paths:
  /health/live:
    get:
      tags: [Service]
      operationId: getLiveness
      summary: Check whether the HTTP process is alive
      responses:
        '200':
          description: The process can serve HTTP requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /status:
    get:
      tags: [Service]
      operationId: getStatus
      summary: Read the fixed project's lifecycle and load progress
      responses:
        '200':
          description: Current lifecycle state, including LOADING and FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /capabilities:
    get:
      tags: [Service]
      operationId: getCapabilities
      summary: Read server and pinned-Jadx capability evidence
      responses:
        '200':
          description: Capability status is scoped to tested behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /shutdown:
    post:
      tags: [Service]
      operationId: shutdownService
      summary: Request graceful shutdown of this fixed-project process
      description: >-
        Omitted policy means discard. Active operations and nonterminal jobs
        return retryable PROJECT_BUSY without cancellation. refuse_if_dirty
        rejects unsaved edits without changing admission. save uses the native
        project path already established by startup or an explicit save and
        checks external changes before shutdown. The acknowledgment is sent
        before listener teardown; SIGKILL cannot guarantee persistence.
        A clearly cross-origin Origin returns INPUT_SECURITY_REJECTION.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShutdownRequest'
      responses:
        '202':
          description: Shutdown accepted; listener teardown follows the complete response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownAccepted'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '403':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          description: >-
            PROJECT_BUSY for active work or dirty refuse_if_dirty; active work
            includes bounded ShutdownBusyDetails in error.details. A native
            save conflict returns EXTERNAL_MODIFICATION_CONFLICT. For raw-input
            startup without an established native .jadx target, policy=save
            returns INVALID_REQUEST; first call /project/save with a targetPath.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            INTERNAL_ERROR if shutdown-save native I/O or runtime processing
            fails. When safely possible, the service remains READY with
            admissions reopened and pending edits retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ApiErrorResponse'
  /project:
    get:
      tags: [Project]
      operationId: getProject
      summary: Read the fixed project's native path, inputs, dirty state and revisions
      responses:
        '200':
          description: Current in-memory project state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedProject'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/mappings/export:
    post:
      tags: [Project]
      operationId: exportMappings
      summary: Export verified current declarations to a new Tiny v2 file
      description: >-
        Strict synchronous export of accepted attached Tiny v2 declarations plus
        current native class/method/field aliases and LINE declaration comments.
        Native aliases take precedence; attached and native comments are additive.
        Does not save, attach the output, or change project state or revisions.
        Requires an absolute normalized .tiny path with an existing nonsymlink
        parent under allowed roots. Existing targets are never overwritten,
        including create-after-check races. Unsupported structures, namespaces,
        inversion, duplicate/unknown records or unresolved keys fail before output.
        An attached zero-byte mapping file returns 422 UNSUPPORTED_CAPABILITY;
        no attached mapping and no native edits may export a header-only Tiny file.
        Limits are 64 KiB request, 4096 path characters, 10000 declaration/comment
        entries, 4 MiB source/output bytes, 16384 characters per string and a
        conservative 16 MiB intermediate allocation budget. Native project
        baseline hashing is capped at 16 MiB. No partial output.
        Cross-origin requests return INPUT_SECURITY_REJECTION. Incompatible
        engine work returns prompt PROJECT_BUSY. Filesystems without supported
        hard-link publication fail closed. Parent identity is rechecked before
        publication; uncooperative directory replacement during the final syscall
        remains an operating-system TOCTOU limitation. Post-publication failures
        report published:true and targetPath; clients must not blindly retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MappingExportRequest' }
      responses:
        '200':
          description: New output published after codec read-back verification; counts and hash observed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MappingExportReceipt' }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409':
          description: STALE_REVISION, PROJECT_BUSY or EXTERNAL_MODIFICATION_CONFLICT; no output published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '422':
          description: UNSUPPORTED_CAPABILITY with bounded categories; no output published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
  /project/mappings/import:
    post:
      tags: [Project]
      operationId: importMappings
      summary: Merge validated local Tiny v2 declarations into unsaved native edits
      description: >-
        MERGE_FAIL_ON_CONFLICT is the only mode. Requires all five fields and an
        existing absolute normalized .tiny regular file under an allowed root,
        with no symlink components. Protected input and native project paths
        are rejected; the accepted attached mapping may be read without attaching
        or modifying it. Captured UTF-8 Tiny 2.0 bytes must use original/mapped
        namespaces. Unknown or duplicate records, metadata/options, inversion,
        arguments, locals, unresolved or unsupported declaration keys fail closed.
        Full original JVM member descriptors include return and field types.
        Identical effective aliases/comments are unchanged. A differing existing
        alias (including automatically generated engine aliases) or a resulting name collision returns MAPPING_MERGE_CONFLICT.
        New names follow declaration edit ASCII identifier rules. Class renames
        preserve the current package; package moves, changed inner aliases and inner
        alias records with a concurrently renamed enclosing class are unsupported.
        Class renames require uniqueness across all resulting visible qualified
        aliases, including untouched descendants requalified by an enclosing class
        rename. A descendant collision rejects the entire import before native staging.
        Comments are representable single LINE values. A composite is supported only
        as an exact accepted attached prefix plus a newline and one new native LINE
        suffix, when no native declaration comment conflicts. Other changed comments
        conflict; ambiguous styles/composites are unsupported. No records are omitted.
        Parsed counts count declarations/comments; applied and unchanged count alias
        and comment operations (an empty destination contributes no alias operation).
        The whole plan is validated and staged privately before one native replacement.
        Rejection, staging failure and NO_CHANGE leave native/index/cache state intact.
        APPLIED increments logical/index revisions once and invalidates derived state.
        No file is written, saved or attached; explicit native save remains required.
        A post-replacement replay failure returns INTERNAL_ERROR and fails the runtime;
        rollback is not promised. Source identity/bytes and accepted native/mapping
        baselines are checked immediately before commit, without filesystem locking.
        External writers after the final check remain a residual race.
        Limits are 64 KiB HTTP body, 4096 path characters, 4 MiB source bytes,
        10000 parsed declaration/comment records, 16384 characters per parsed string,
        a conservative aggregate 16 MiB intermediate budget and bounded metadata
        enumeration. A request may reach the memory budget before other ceilings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MappingImportRequest' }
            examples:
              merge: { externalValue: examples/mapping-import-request.json }
      responses:
        '200':
          description: Immutable receipt for one in-memory commit or an equivalent no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MappingImportReceipt' }
              examples:
                applied: { externalValue: examples/mapping-import-applied.json }
                unchanged: { externalValue: examples/mapping-import-no-change.json }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '404': { $ref: '#/components/responses/ApiErrorResponse' }
        '409':
          description: STALE_REVISION, PROJECT_BUSY, EXTERNAL_MODIFICATION_CONFLICT or MAPPING_MERGE_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                conflict: { externalValue: examples/mapping-import-conflict.json }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '422':
          description: UNSUPPORTED_CAPABILITY or INVALID_ENTITY_ID; entire import rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
  /project/save:
    post:
      tags: [Project]
      operationId: saveProject
      summary: Explicitly save native Jadx project data
      description: >-
        The targetPath is required for the first save after raw-input startup.
        The service checks the native project and mappings against their on-disk
        baselines before writing. Conflicting in-flight project operations fail
        promptly with HTTP 409 PROJECT_BUSY (retryable); they are not queued.
        Interrupted native writes may require a user backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectRequest'
      responses:
        '200':
          description: Native save completed and the file was fingerprinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedProject'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/settings:
    get:
      tags: [Project]
      operationId: getProjectSettings
      summary: Read native mapping path and effective decompilation mode
      responses:
        '200':
          description: Current settings and revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
    patch:
      tags: [Project]
      operationId: updateProjectSettings
      summary: Stage a native mapping path and rebuild Jadx analysis
      description: >-
        The decompilation mode is temporary-only and cannot be persisted here.
        Conflicting in-flight project operations fail promptly with HTTP 409
        PROJECT_BUSY (retryable); they are not queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectSettingsRequest'
      responses:
        '200':
          description: Jadx was rebuilt and the native mapping path is staged in memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/reload:
    post:
      tags: [Project]
      operationId: reloadProject
      summary: Reload the same native project from disk
      description: >-
        The caller must provide the session and logical revision it observed.
        A stale precondition is rejected before any unsaved edit is discarded.
        Conflicting in-flight project operations fail promptly with HTTP 409
        PROJECT_BUSY (retryable); they are not queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadProjectRequest'
      responses:
        '200':
          description: Native project and Jadx analysis reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedProject'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/pending-edits/export:
    post:
      tags: [Project]
      operationId: exportPendingEdits
      summary: Return the current native code data without writing a file
      responses:
        '200':
          description: Transient in-memory code data snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEdits'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /edits/batch:
    post:
      tags: [Project]
      operationId: applyEditBatch
      summary: Apply native declaration edits to the in-memory project
      description: >-
        Validates every item under one exclusive admission before changing native
        code data. Preconditions are either both supplied or both omitted;
        omission means unconditional admission against the current revision.
        A complete no-op retains all revisions and dirty state. A successful
        edit remains memory-only until explicit native save. An unexpected
        staging failure returns PARTIAL with itemized FAILED and SKIPPED results,
        committing a verified applied prefix when one exists. If no item was
        applied, logical/index revisions and dirty state remain unchanged.
        Only LINE declaration comments are currently accepted. No automatic
        override propagation, mapping export, parameter or local editing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditBatchRequest' }
            examples:
              renameAndComment: { externalValue: ./examples/edit-batch-request.json }
      responses:
        '200':
          description: Applied, no change, or itemized staging failure with any committed prefix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditBatchResult' }
              examples:
                applied: { externalValue: ./examples/edit-batch-applied.json }
                noChange: { externalValue: ./examples/edit-batch-no-change.json }
                partial: { externalValue: ./examples/edit-batch-partial.json }
                partialNoApplied: { externalValue: ./examples/edit-batch-partial-no-applied.json }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '404': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '422': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /references/query:
    post:
      tags: [Symbols]
      operationId: queryReferences
      summary: Query bounded Jadx-reported original reference relationships
      description: >-
        Uses current primary settings under one conservative CLASS_READ lease.
        CALL is a distinct observed method pair, not an invoke count or dynamic
        dispatch closure. FIELD_USE has unknown access direction. CLASS_DEPENDENCY
        is class-level, not a type occurrence. Coverage is always PARTIAL;
        pageComplete only exhausts the filtered observed set. strict rejects
        resolved queries with 409 INCOMPLETE_ANALYSIS; domain misses remain 200.
        Source sites are optional, exact tokens with verified caller and target
        in a P4.2 source snapshot. Original offsets are unavailable.
        HMAC authentication precedes cursor field interpretation. Changed query
        options or tampering return 400; authentic stale session, revision,
        publication, settings or graph content returns 409 STALE_REVISION.
        Limits are 10000 observed edges, 20000 sites and 4 MiB copied strings,
        enforced during collection. These do not bound Jadx internal allocation
        or wall time. Busy admission fails promptly with PROJECT_BUSY.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceQuery' }
            examples:
              sourceSites: { externalValue: ./examples/references-query.json }
      responses:
        '200':
          description: Typed outcome and bounded observed relationships; never exhaustive program analysis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferencePage' }
              examples:
                methods: { externalValue: ./examples/references-method.json }
                fields: { externalValue: ./examples/references-field.json }
                classes: { externalValue: ./examples/references-class.json }
                sites: { externalValue: ./examples/references-sites.json }
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/ApiErrorResponse'
        '415':
          $ref: '#/components/responses/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/ApiErrorResponse'
        '503':
          $ref: '#/components/responses/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/ApiErrorResponse'
  /classes:
    get:
      tags: [Symbols]
      operationId: listClasses
      summary: Page through currently Jadx-visible classes by original descriptor
      description: >-
        Includes eligible inner and anonymous classes by default. This is the
        current Jadx-visible set, not a census of every source definition.
        Original descriptors determine order; aliases never determine identity
        or default order. complete means this filtered visible enumeration is
        exhausted, while sourceCoverage=UNVERIFIED means discarded or merged
        input definitions cannot be ruled out. Cursors bind session, logical
        revision, engine publication and normalized filters. Busy work returns
        retryable PROJECT_BUSY; loading/reloading/shutdown returns 503. The
        signature is checked before cursor payload fields. A tampered cursor
        returns 400 INVALID_REQUEST; an authentic cursor from an older
        session/revision/publication returns 409 STALE_REVISION.
      parameters:
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: packagePrefix
          description: Exact original dotted package or its dot-delimited descendants.
          schema: { type: string, maxLength: 512 }
        - in: query
          name: nameContains
          description: Case-sensitive substring of the selected dotted qualified name.
          schema: { type: string, maxLength: 256 }
        - in: query
          name: nameDomain
          schema: { type: string, enum: [original, alias], default: original }
        - in: query
          name: includeInner
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: One bounded page of the filtered visible class set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassPage' }
              examples:
                firstPage:
                  externalValue: ./examples/classes-first-page.json
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /symbols/resolve:
    post:
      tags: [Symbols]
      operationId: resolveSymbol
      summary: Resolve an exact original class, method or field identity
      description: >-
        Well-formed domain misses and uncertain provenance return typed HTTP
        200 outcomes. A supplied inputIdentity cannot be selected unless exact
        per-input attribution is verified. Member lookup can load/decompile only
        the requested declaring class. No lookup saves or changes a revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SymbolResolveRequest' }
      responses:
        '200':
          description: RESOLVED, NOT_FOUND, AMBIGUOUS or PROVENANCE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SymbolResolution' }
              examples:
                classResolved: { externalValue: ./examples/class-resolved.json }
                methodResolved: { externalValue: ./examples/method-resolved.json }
                fieldResolved: { externalValue: ./examples/field-resolved.json }
                ambiguous: { externalValue: ./examples/symbol-ambiguous.json }
                provenanceUnavailable: { externalValue: ./examples/symbol-provenance-unavailable.json }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /decompile:
    post:
      tags: [Analysis]
      operationId: decompileJava
      summary: Get Jadx Java for one original class or method identity
      description: >-
        A method request returns its containing class source. A method excerpt
        is present only when its original declaration and complete boundary
        are independently verified. Source offsets index UTF-16 code units in
        the exact returned Java string; ranges are half-open. Lines are 1-based
        and columns are 0-based Unicode code points. Source coordinates are not
        bytecode offsets or original debug-source line numbers. Strict mode
        returns INCOMPLETE_ANALYSIS when requested coverage is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecompileRequest' }
      responses:
        '200':
          description: Original-symbol outcome and bounded Java source, if available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecompileResult' }
              examples:
                class: { externalValue: ./examples/decompile-class.json }
                method: { externalValue: ./examples/decompile-method.json }
                methodFallback: { externalValue: ./examples/decompile-method-fallback.json }
                partial:
                  description: Simulated pinned-node error renderer; no naturally failing Jadx fixture is claimed.
                  externalValue: ./examples/decompile-partial.json
                ambiguous:
                  description: Schema example for multiple Jadx-visible definitions; the owned two-JAR fixture collapses to one.
                  externalValue: ./examples/decompile-ambiguous.json
                unavailable: { externalValue: ./examples/decompile-unavailable.json }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '422': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /search:
    post:
      tags: [Analysis]
      operationId: search
      summary: Search the current process-local Jadx-visible index
      description: >-
        Class names are cataloged without decompiling Java. Member and emitted-owner
        Java coverage grows as classes are processed. COMPLETE describes only
        currently Jadx-visible eligible entities, never every original input
        definition. Source ranges are UTF-16 half-open offsets into the exact
        emitted Java source snapshot. strict rejects partial coverage. If
        requireComplete is set, an incomplete index starts or reuses an async
        build and returns 202; repeat the query after that job finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            examples:
              source: { externalValue: ./examples/search-request.json }
      responses:
        '200':
          description: One immutable result page with explicit domain coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
              examples:
                partial: { externalValue: ./examples/search-partial.json }
                complete: { externalValue: ./examples/search-complete.json }
        '202': { $ref: '#/components/responses/AcceptedJob' }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '422': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/JobResourceLimit' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /search/build-index:
    post:
      tags: [Analysis]
      operationId: buildSearchIndex
      summary: Build supported member and emitted-Java search domains asynchronously
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchBuildRequest' }
      responses:
        '200':
          description: Selected domains are already complete in the current index.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchIndexStatus' }
        '202': { $ref: '#/components/responses/AcceptedJob' }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '422': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/JobResourceLimit' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Service]
      operationId: getJob
      summary: Poll a retained process-local job
      description: Unknown, evicted, and expired IDs return 404; malformed UUIDs return 400. Polling never requires an SSE connection.
      responses:
        '200':
          description: Immutable current job snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Service]
      operationId: cancelJob
      summary: Request cooperative cancellation
      description: >-
        Idempotent. A queued job can become CANCELLED immediately. A running job
        remains CANCELLING until its work and owned cleanup actually cease. A
        clearly cross-origin request returns 403 INPUT_SECURITY_REJECTION.
      responses:
        '200':
          description: Current job snapshot after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '403':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
  /jobs/{jobId}/events:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Service]
      operationId: getJobEvents
      summary: Replay and follow bounded job events
      description: >-
        text/event-stream with numeric per-job IDs starting at 1. Events are
        job.queued, job.started, job.progress, job.cancel_requested,
        job.completed, job.failed, and job.cancelled. Omit Last-Event-ID to
        replay all retained events. A header older than retained history returns
        409 EVENT_HISTORY_EXPIRED before streaming; a future or malformed ID
        returns 400 INVALID_REQUEST. Clients may poll and reconnect without the
        stale ID. Comment heartbeats have no ID. Overflow disconnects the slow
        subscriber without cancelling the job. Terminal events close the stream.
        Unknown, evicted, or expired jobs return 404.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: SSE frames; each data line is a bounded JobEvent JSON object.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/JobResourceLimit'
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AcceptedJob:
      description: HTTP 202 contract for asynchronous job-producing operations.
      headers:
        Location:
          required: true
          schema:
            type: string
            pattern: '^/api/v1/jobs/'
        X-Request-Id:
          schema:
            type: string
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Job'
          examples:
            searchBuild: { externalValue: ./examples/search-job-queued.json }
    JobResourceLimit:
      description: HTTP 429 RESOURCE_LIMIT when the process-local queue or retention budget is exhausted.
      headers:
        X-Request-Id:
          schema:
            type: string
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApiErrorResponse:
      description: Structured API error.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Identifier for correlating this response with local service logs.
        Retry-After:
          schema:
            type: integer
          description: Present while the project is still loading; omitted for failed loads and shutdown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    MappingImportRequest:
      type: object
      additionalProperties: false
      required: [sourcePath, format, mode, expectedSessionId, expectedLogicalRevision]
      properties:
        sourcePath: { type: string, minLength: 1, maxLength: 4096 }
        format: { type: string, const: TINY_V2 }
        mode: { type: string, const: MERGE_FAIL_ON_CONFLICT }
        expectedSessionId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        expectedLogicalRevision: { type: integer, minimum: 0, maximum: 9223372036854775807 }
    MappingImportReceipt:
      type: object
      additionalProperties: false
      required: [format, mode, sourcePath, sha256, bytes, parsed, applied, unchanged, sessionId, beforeLogicalRevision, afterLogicalRevision, beforeIndexRevision, afterIndexRevision, dirty, saved, mappingAttached, outcome, omissions]
      properties:
        format: { type: string, const: TINY_V2 }
        mode: { type: string, const: MERGE_FAIL_ON_CONFLICT }
        sourcePath: { type: string, maxLength: 4096 }
        sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        bytes: { type: integer, minimum: 1, maximum: 4194304 }
        parsed: { $ref: '#/components/schemas/MappingExportCounts' }
        applied: { $ref: '#/components/schemas/MappingImportEditCounts' }
        unchanged: { $ref: '#/components/schemas/MappingImportEditCounts' }
        sessionId: { type: string, format: uuid }
        beforeLogicalRevision: { type: integer, minimum: 0 }
        afterLogicalRevision: { type: integer, minimum: 0 }
        beforeIndexRevision: { type: integer, minimum: 0 }
        afterIndexRevision: { type: integer, minimum: 0 }
        dirty: { type: boolean }
        saved: { type: boolean, const: false }
        mappingAttached: { type: boolean, const: false }
        outcome: { type: string, enum: [APPLIED, NO_CHANGE] }
        omissions: { type: array, maxItems: 0, items: { type: object } }
    MappingImportEditCounts:
      type: object
      additionalProperties: false
      required: [aliases, comments]
      properties:
        aliases: { type: integer, minimum: 0, maximum: 10000 }
        comments: { type: integer, minimum: 0, maximum: 10000 }
    MappingExportRequest:
      type: object
      additionalProperties: false
      required: [targetPath, format, expectedSessionId, expectedLogicalRevision]
      properties:
        targetPath: { type: string, minLength: 1, maxLength: 4096 }
        format: { type: string, const: TINY_V2 }
        expectedSessionId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        expectedLogicalRevision: { type: integer, minimum: 0, maximum: 9223372036854775807 }
    MappingExportReceipt:
      type: object
      additionalProperties: false
      required: [format, targetPath, sessionId, logicalRevision, source, completeness, exported, bytes, sha256, omissions, projectMutated]
      properties:
        format: { type: string, const: TINY_V2 }
        targetPath: { type: string, maxLength: 4096 }
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, minimum: 0 }
        source: { type: string, const: CURRENT_IN_MEMORY_WITH_ATTACHED_MAPPINGS }
        completeness: { type: string, const: VERIFIED_DECLARATIONS }
        exported: { $ref: '#/components/schemas/MappingExportCounts' }
        bytes: { type: integer, minimum: 0, maximum: 4194304 }
        sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        omissions: { type: array, maxItems: 0, items: { type: object } }
        projectMutated: { type: boolean, const: false }
    MappingExportCounts:
      type: object
      additionalProperties: false
      required: [classes, methods, fields, comments]
      properties:
        classes: { type: integer, minimum: 0, maximum: 10000 }
        methods: { type: integer, minimum: 0, maximum: 10000 }
        fields: { type: integer, minimum: 0, maximum: 10000 }
        comments: { type: integer, minimum: 0, maximum: 10000 }
    EditBatchRequest:
      type: object
      additionalProperties: false
      required: [items]
      dependentRequired:
        expectedSessionId: [expectedLogicalRevision]
        expectedLogicalRevision: [expectedSessionId]
      properties:
        expectedSessionId: { type: string, format: uuid }
        expectedLogicalRevision: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/EditOperation' }
    EditOperation:
      oneOf:
        - $ref: '#/components/schemas/RenameOperation'
        - $ref: '#/components/schemas/SetCommentOperation'
      discriminator:
        propertyName: kind
        mapping:
          RENAME: '#/components/schemas/RenameOperation'
          SET_COMMENT: '#/components/schemas/SetCommentOperation'
    RenameOperation:
      type: object
      additionalProperties: false
      required: [kind, target, newName]
      properties:
        kind: { const: RENAME }
        target: { $ref: '#/components/schemas/SymbolRef' }
        newName: { type: string, minLength: 1, maxLength: 128 }
    SetCommentOperation:
      type: object
      additionalProperties: false
      required: [kind, target, comment, style]
      properties:
        kind: { const: SET_COMMENT }
        target: { $ref: '#/components/schemas/SymbolRef' }
        comment: { type: string, minLength: 1, maxLength: 4096 }
        style: { const: LINE }
    EditBatchResult:
      type: object
      additionalProperties: false
      required: [outcome, sessionId, logicalRevisionBefore, logicalRevisionAfter, indexRevisionAfter, dirty, saved, items, diagnostics]
      properties:
        outcome:
          type: string
          enum: [APPLIED, NO_CHANGE, PARTIAL]
          description: >-
            PARTIAL reports a staging failure, including failure before any
            APPLIED item. Inspect items and logicalRevisionAfter for the exact
            committed state; no applied items means revisions/dirty are unchanged.
        sessionId: { type: string }
        logicalRevisionBefore: { type: integer, format: int64, minimum: 0 }
        logicalRevisionAfter: { type: integer, format: int64, minimum: 0 }
        indexRevisionAfter: { type: integer, format: int64, minimum: 0 }
        dirty: { type: boolean }
        saved: { const: false }
        items:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/EditItemResult' }
        diagnostics:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 256 }
    EditItemResult:
      type: object
      additionalProperties: false
      required: [index, status, kind, target, affectedRefs, message]
      properties:
        index: { type: integer, minimum: 0, maximum: 63 }
        status: { type: string, enum: [APPLIED, FAILED, SKIPPED] }
        kind: { type: string, enum: [RENAME, SET_COMMENT] }
        target: { $ref: '#/components/schemas/SymbolRef' }
        affectedRefs:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/SymbolRef' }
        message: { type: [string, 'null'], maxLength: 256 }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 512 }
        domains:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: string, enum: [CLASS_NAME, MEMBER_NAME, SOURCE_TEXT, STRING_LITERAL] }
        matchMode: { type: string, enum: [EXACT, CONTAINS, REGEX], default: CONTAINS }
        caseSensitive: { type: boolean, default: true }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 50 }
        cursor: { type: [string, 'null'], maxLength: 1024 }
        strict: { type: boolean, default: false }
        requireComplete: { type: boolean, default: false }
        expectedSessionId: { type: [string, 'null'] }
        expectedLogicalRevision: { type: [integer, 'null'], format: int64, minimum: 0 }
    SearchBuildRequest:
      type: object
      additionalProperties: false
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: string, enum: [CLASS_NAME, MEMBER_NAME, SOURCE_TEXT, STRING_LITERAL] }
        force: { type: boolean, default: false }
    SearchCoverage:
      type: object
      additionalProperties: false
      required: [domain, availability, state, scope, sourceInputCoverage, eligible, indexed, pending, skipped, failed, evicted, diagnostics]
      properties:
        domain: { type: string, enum: [CLASS_NAME, MEMBER_NAME, SOURCE_TEXT, STRING_LITERAL] }
        availability: { type: string, enum: [SUPPORTED, UNSUPPORTED] }
        state: { type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE] }
        scope: { type: string, const: JADX_VISIBLE_ELIGIBLE }
        sourceInputCoverage: { type: string, const: UNVERIFIED }
        eligible: { type: integer, minimum: 0 }
        indexed: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        evicted: { type: integer, minimum: 0 }
        diagnostics: { type: array, maxItems: 16, items: { type: string } }
    SearchHit:
      type: object
      additionalProperties: false
      required: [domain, ref, sourceOwnerRef, displayName, matchedText, matchMode, range, sourceSnapshotId]
      properties:
        domain: { type: string, enum: [CLASS_NAME, MEMBER_NAME, SOURCE_TEXT, STRING_LITERAL] }
        ref:
          oneOf:
            - $ref: '#/components/schemas/SymbolRef'
            - type: 'null'
        sourceOwnerRef:
          oneOf:
            - $ref: '#/components/schemas/SymbolRef'
            - type: 'null'
        displayName: { type: [string, 'null'] }
        matchedText: { type: string, maxLength: 160 }
        matchMode: { type: string, enum: [EXACT, CONTAINS, REGEX] }
        range:
          oneOf:
            - $ref: '#/components/schemas/SourceRange'
            - type: 'null'
        sourceSnapshotId: { type: [string, 'null'] }
    SearchPage:
      type: object
      additionalProperties: false
      required: [sessionId, logicalRevision, settingsFingerprint, indexSnapshotId, indexGeneration, resultSnapshotId, coverage, hits, nextCursor, pageComplete, diagnostics]
      properties:
        sessionId: { type: string }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        settingsFingerprint: { type: string }
        indexSnapshotId: { type: string }
        indexGeneration: { type: integer, format: int64, minimum: 0 }
        resultSnapshotId: { type: string }
        coverage: { type: array, items: { $ref: '#/components/schemas/SearchCoverage' } }
        hits: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SearchHit' } }
        nextCursor: { type: [string, 'null'], maxLength: 1024 }
        pageComplete: { type: boolean }
        diagnostics: { type: array, maxItems: 16, items: { type: string } }
    SearchIndexStatus:
      type: object
      additionalProperties: false
      required: [sessionId, logicalRevision, settingsFingerprint, indexSnapshotId, indexGeneration, coverage]
      properties:
        sessionId: { type: string }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        settingsFingerprint: { type: string }
        indexSnapshotId: { type: string }
        indexGeneration: { type: integer, format: int64, minimum: 0 }
        coverage: { type: array, items: { $ref: '#/components/schemas/SearchCoverage' } }
    SymbolRef:
      type: object
      additionalProperties: false
      required: [kind, originalClassDescriptor]
      if:
        properties:
          kind: { enum: [METHOD, FIELD] }
        required: [kind]
      then:
        required: [originalName, originalDescriptor]
        properties:
          originalName: { type: string }
          originalDescriptor: { type: string }
      else:
        properties:
          originalName: { type: 'null' }
          originalDescriptor: { type: 'null' }
      properties:
        kind: { type: string, enum: [CLASS, METHOD, FIELD] }
        originalClassDescriptor:
          type: string
          maxLength: 1024
          pattern: '^L(?:[^./;\[\]<>\s]+/)*[^./;\[\]<>\s]+;$'
        inputIdentity: { type: [string, 'null'], maxLength: 256 }
        originalName: { type: [string, 'null'], maxLength: 512 }
        originalDescriptor: { type: [string, 'null'], maxLength: 2048 }
      description: >-
        Exact original JVM/DEX identity. CLASS omits member fields or carries
        null; METHOD and FIELD require non-null values for both. Class names use
        Lpackage/Top$Inner; with nonempty
        slash-delimited segments, no dots or array prefix. Method descriptors
        contain zero or more nonvoid field types in parentheses and one return
        type, which may be V. Field descriptors contain exactly one nonvoid
        type. No whitespace, generic syntax or normalization is accepted.
    SymbolInfo:
      type: object
      additionalProperties: false
      required: [ref, originalName, originalDescriptor, displayName, displayQualifiedName, provenance]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        originalName: { type: [string, 'null'] }
        originalDescriptor: { type: [string, 'null'] }
        displayName: { type: string }
        displayQualifiedName: { type: string }
        containingClass:
          oneOf:
            - { $ref: '#/components/schemas/SymbolRef' }
            - { type: 'null' }
        provenance: { type: string, enum: [EXACT, AMBIGUOUS, UNAVAILABLE] }
    ClassInfo:
      type: object
      additionalProperties: false
      required: [ref, originalDottedName, displayName, displayQualifiedName, isInner, codeAvailable, provenance]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        originalDottedName: { type: string }
        displayName: { type: string }
        displayQualifiedName: { type: string }
        isInner: { type: boolean }
        codeAvailable:
          type: boolean
          description: False when Jadx marks the class DONT_GENERATE, including inlined anonymous classes.
        originalParent:
          oneOf:
            - { $ref: '#/components/schemas/SymbolRef' }
            - { type: 'null' }
        provenance: { type: string, enum: [EXACT, AMBIGUOUS, UNAVAILABLE] }
    ClassPage:
      type: object
      additionalProperties: false
      required: [sessionId, logicalRevision, snapshotId, scope, sourceCoverage, items, nextCursor, complete]
      properties:
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        snapshotId: { type: string }
        scope: { const: JADX_VISIBLE }
        sourceCoverage: { const: UNVERIFIED }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ClassInfo' }
        nextCursor: { type: [string, 'null'], maxLength: 4096 }
        complete: { type: boolean }
    SymbolResolveRequest:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        expectedSessionId: { type: string, format: uuid }
        expectedLogicalRevision: { type: integer, format: int64, minimum: 0 }
      description: expectedSessionId and expectedLogicalRevision must occur together.
    SymbolResolution:
      type: object
      additionalProperties: false
      required: [outcome, queriedRef, sessionId, logicalRevision, snapshotId, candidates, diagnostics]
      properties:
        outcome: { type: string, enum: [RESOLVED, NOT_FOUND, AMBIGUOUS, PROVENANCE_UNAVAILABLE] }
        queriedRef: { $ref: '#/components/schemas/SymbolRef' }
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        snapshotId: { type: string }
        symbol:
          oneOf:
            - { $ref: '#/components/schemas/SymbolInfo' }
            - { type: 'null' }
        candidates:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SymbolInfo' }
        diagnostics:
          type: array
          maxItems: 16
          items: { type: string }
    ReferenceQuery:
      type: object
      additionalProperties: false
      required: [ref, direction]
      dependentRequired:
        expectedSessionId: [expectedLogicalRevision]
        expectedLogicalRevision: [expectedSessionId]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        relations:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/ReferenceRelation' }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 50 }
        cursor: { type: [string, 'null'], maxLength: 4096 }
        includeSourceSites: { type: boolean, default: false }
        strict: { type: boolean, default: false }
        expectedSessionId: { type: string, format: uuid }
        expectedLogicalRevision: { type: integer, format: int64, minimum: 0 }
      description: >-
        Direction is always required. FIELD accepts only INCOMING/FIELD_USE;
        CLASS accepts CLASS_DEPENDENCY; METHOD INCOMING accepts CALL and OUTGOING
        accepts CALL/UNRESOLVED_CALL. Omitted relations selects all compatible
        relations. Empty, repeated or incompatible relations (including unproved
        READ/WRITE) return 400 INVALID_REQUEST. Unknown/repeated fields and bodies
        over 64 KiB are rejected. Revision preconditions are checked after admission.
    ReferenceRelation:
      type: string
      enum: [CALL, UNRESOLVED_CALL, FIELD_USE, CLASS_DEPENDENCY]
    ReferenceSite:
      type: object
      additionalProperties: false
      required: [sourceOwnerRef, sourceSnapshotId, position, precision]
      properties:
        sourceOwnerRef: { $ref: '#/components/schemas/SymbolRef' }
        sourceSnapshotId: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        position: { $ref: '#/components/schemas/SourcePoint' }
        precision: { const: EXACT }
    ReferenceEdge:
      type: object
      additionalProperties: false
      required: [sourceRef, targetRef, relation, resolution, evidence, sourceSites, sourceSiteCoverage, originalOffset]
      properties:
        sourceRef: { $ref: '#/components/schemas/SymbolRef' }
        targetRef: { $ref: '#/components/schemas/SymbolRef' }
        relation: { $ref: '#/components/schemas/ReferenceRelation' }
        resolution: { type: string, enum: [RESOLVED, UNRESOLVED, OBSERVED] }
        evidence:
          type: string
          enum: [JADX_METHOD_USED, JADX_METHOD_USE_IN, JADX_METHOD_UNRESOLVED_USED, JADX_FIELD_USE_IN, JADX_CLASS_DEPENDENCY, JADX_CLASS_USE_IN]
        sourceSites: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/ReferenceSite' } }
        sourceSiteCoverage: { type: string, enum: [PARTIAL, UNAVAILABLE] }
        originalOffset: { type: 'null' }
      description: OBSERVED means a reported node has no verified standalone visible declaration; per-input provenance is always unavailable.
    ReferenceCapabilities:
      type: object
      additionalProperties: false
      required: [resolvedTarget, sourceLocation, originalOffset, referenceKind, globalCoverage]
      properties:
        resolvedTarget: { $ref: '#/components/schemas/SourceAvailability' }
        sourceLocation: { $ref: '#/components/schemas/SourceAvailability' }
        originalOffset: { const: UNAVAILABLE }
        referenceKind: { const: PARTIAL }
        globalCoverage: { const: UNKNOWN }
    ReferencePage:
      type: object
      additionalProperties: false
      required: [outcome, queriedRef, direction, candidates, sessionId, logicalRevision, snapshotId, scope, coverage, edges, nextCursor, pageComplete, capabilities, diagnostics]
      properties:
        outcome: { type: string, enum: [RESOLVED, NOT_FOUND, AMBIGUOUS, PROVENANCE_UNAVAILABLE] }
        queriedRef: { $ref: '#/components/schemas/SymbolRef' }
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        candidates: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/SymbolInfo' } }
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        snapshotId: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
        scope: { const: JADX_REPORTED }
        coverage:
          type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status: { const: PARTIAL }
            reason: { type: string, maxLength: 512 }
        edges: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ReferenceEdge' } }
        nextCursor: { type: [string, 'null'], maxLength: 4096 }
        pageComplete: { type: boolean }
        capabilities: { $ref: '#/components/schemas/ReferenceCapabilities' }
        diagnostics: { type: array, maxItems: 16, items: { type: string, maxLength: 512 } }
    DecompileRequest:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        representation: { type: string, default: JAVA }
        decompilationMode: { type: string, enum: [AUTO, RESTRUCTURE, SIMPLE, FALLBACK] }
        includeAnnotations: { type: boolean, default: true }
        includeRawDebugLines: { type: boolean, default: false }
        strict: { type: boolean, default: false }
        expectedSessionId: { type: string, format: uuid }
        expectedLogicalRevision: { type: integer, format: int64, minimum: 0 }
        expectedSourceSnapshotId: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      description: >-
        Only CLASS and METHOD refs are accepted. Revision preconditions must
        occur together. Only JAVA is currently supported; other representations
        return 422 UNSUPPORTED_CAPABILITY. Requests are limited to 64 KiB.
    SourcePoint:
      type: object
      additionalProperties: false
      required: [offsetUtf16, line, columnCodePoints]
      properties:
        offsetUtf16: { type: integer, minimum: 0, description: Zero-based UTF-16 code-unit boundary. }
        line: { type: integer, minimum: 1 }
        columnCodePoints: { type: integer, minimum: 0 }
      description: >-
        On CRLF, the CR boundary belongs to the preceding line and the LF
        boundary belongs to the same line; the boundary after LF starts the next line.
    SourceRange:
      type: object
      additionalProperties: false
      required: [startOffsetUtf16, endOffsetUtf16, start, end, sourceSnapshotId]
      properties:
        startOffsetUtf16: { type: integer, minimum: 0 }
        endOffsetUtf16: { type: integer, minimum: 0 }
        start: { $ref: '#/components/schemas/SourcePoint' }
        end: { $ref: '#/components/schemas/SourcePoint' }
        sourceSnapshotId: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      description: Half-open range in the exact returned Java string.
    SourceAnnotation:
      type: object
      additionalProperties: false
      required: [kind, position, targetRef, precision, sourceSnapshotId]
      properties:
        kind: { type: string, enum: [DECLARATION, REFERENCE] }
        position: { $ref: '#/components/schemas/SourcePoint' }
        targetRef: { $ref: '#/components/schemas/SymbolRef' }
        precision: { const: EXACT }
        sourceSnapshotId: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      description: Validated token-start location, never a complete declaration range.
    SourceCapabilities:
      type: object
      additionalProperties: false
      required: [source, declarationPositions, referenceTargets, methodRange, rawDebugLines, originalBytecodeOffsets, classErrors]
      properties:
        source:
          $ref: '#/components/schemas/SourceAvailability'
          description: EXACT means the returned text is Jadx's exact generated string; status separately reports known partial output.
        declarationPositions: { $ref: '#/components/schemas/SourceAvailability' }
        referenceTargets: { $ref: '#/components/schemas/SourceAvailability' }
        methodRange: { $ref: '#/components/schemas/SourceAvailability' }
        rawDebugLines: { $ref: '#/components/schemas/SourceAvailability' }
        originalBytecodeOffsets: { $ref: '#/components/schemas/SourceAvailability' }
        classErrors: { $ref: '#/components/schemas/SourceAvailability' }
    SourceAvailability:
      type: string
      enum: [EXACT, PARTIAL, UNKNOWN, UNAVAILABLE]
    EffectiveSourceSettings:
      type: object
      additionalProperties: false
      required: [decompilationMode, fingerprint]
      properties:
        decompilationMode: { type: string, enum: [AUTO, RESTRUCTURE, SIMPLE, FALLBACK] }
        fingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    DecompileResult:
      type: object
      additionalProperties: false
      required: [outcome, queriedRef, sourceOwnerRef, candidates, sessionId, logicalRevision, sourceSnapshotId,
        effectiveSettings, status, representation, source, methodRangeAvailable, methodRange, methodSource,
        annotations, rawDebugLines, classErrorCount, diagnostics, capabilities]
      properties:
        outcome: { type: string, enum: [RESOLVED, NOT_FOUND, AMBIGUOUS, PROVENANCE_UNAVAILABLE] }
        queriedRef: { $ref: '#/components/schemas/SymbolRef' }
        sourceOwnerRef:
          oneOf:
            - { $ref: '#/components/schemas/SymbolRef' }
            - { type: 'null' }
        candidates: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/SymbolInfo' } }
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        sourceSnapshotId: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
        effectiveSettings: { $ref: '#/components/schemas/EffectiveSourceSettings' }
        status: { type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE] }
        representation: { const: JAVA }
        source: { type: [string, 'null'], description: Exact Jadx getCodeStr text, capped at 4 MiB UTF-8. }
        methodRangeAvailable: { type: [boolean, 'null'] }
        methodRange:
          oneOf:
            - { $ref: '#/components/schemas/SourceRange' }
            - { type: 'null' }
        methodSource: { type: [string, 'null'] }
        annotations: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/SourceAnnotation' } }
        rawDebugLines: { type: 'null', description: Original debug line mapping is unproved in Jadx 1.5.6. }
        classErrorCount: { type: 'null', description: A class-local error count is not available from verified public APIs. }
        diagnostics: { type: array, maxItems: 16, items: { type: string, maxLength: 512 } }
        capabilities: { $ref: '#/components/schemas/SourceCapabilities' }
    ShutdownRequest:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          enum: [discard, save, refuse_if_dirty]
          default: discard
    ShutdownAccepted:
      type: object
      required: [state, policy]
      additionalProperties: false
      properties:
        state:
          const: SHUTTING_DOWN
        policy:
          type: string
          enum: [discard, save, refuse_if_dirty]
    ShutdownBusyDetails:
      type: object
      required: [activeOperationCount, operations, activeJobCount, jobs]
      properties:
        activeOperationCount:
          type: integer
          minimum: 0
        operations:
          type: array
          maxItems: 16
          items:
            type: object
            required: [id, category, key]
            properties:
              id:
                type: string
                format: uuid
              category:
                type: string
              key:
                type: string
                maxLength: 128
        activeJobCount:
          type: integer
          minimum: 0
        jobs:
          type: array
          maxItems: 16
          items:
            type: object
            required: [jobId, state, type]
            properties:
              jobId:
                type: string
                format: uuid
              state:
                type: string
                enum: [QUEUED, RUNNING, CANCELLING]
              type:
                type: string
                maxLength: 128
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          const: ALIVE
    ServiceStatus:
      type: object
      required: [state, stage, progress, inputs]
      properties:
        state:
          type: string
          enum: [STARTING, LOADING, READY, RELOADING, FAILED, SHUTTING_DOWN, STOPPED]
        stage:
          type: string
          description: Active initialization or lifecycle stage.
        progress:
          $ref: '#/components/schemas/Progress'
        projectPath:
          type: [string, 'null']
          description: Native .jadx path when started from an existing native project.
        inputs:
          type: array
          items:
            type: string
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
    Progress:
      type: object
      required: [completed, total, unit]
      properties:
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        unit:
          type: string
    Capabilities:
      type: object
      required: [serverVersion, jadxVersion, capabilities]
      properties:
        serverVersion:
          type: string
        jadxVersion:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    Capability:
      type: object
      required: [name, status, evidence, persistence]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [SUPPORTED, PARTIAL, UNSUPPORTED, UNKNOWN]
        evidence:
          type: string
        precision:
          type: [string, 'null']
          enum: [EXACT, APPROXIMATE, UNKNOWN, UNAVAILABLE, null]
        persistence:
          type: string
          description: Persistence scope proven for the capability, or UNAVAILABLE.
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - PROJECT_NOT_READY
            - SERVICE_SHUTTING_DOWN
            - PROJECT_LOAD_FAILED
            - METHOD_NOT_ALLOWED
            - PROJECT_BUSY
            - EVENT_HISTORY_EXPIRED
            - INVALID_REQUEST
            - INVALID_ENTITY_ID
            - NOT_FOUND
            - UNSUPPORTED_CAPABILITY
            - INCOMPLETE_ANALYSIS
            - STALE_REVISION
            - EXTERNAL_MODIFICATION_CONFLICT
            - MAPPING_MERGE_CONFLICT
            - RESOURCE_LIMIT
            - CANCELLATION_PENDING
            - INPUT_SECURITY_REJECTION
            - INTERNAL_ERROR
            - OPERATION_NOT_IMPLEMENTED
          description: Stable machine-readable error code.
        message:
          type: string
        retryable:
          type: boolean
        requestId:
          type: [string, 'null']
        details:
          type: [object, 'null']
          additionalProperties: true
        causes:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        itemErrors:
          type: array
          items:
            $ref: '#/components/schemas/ItemError'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ItemError:
      type: object
      required: [index, code, message]
      properties:
        index:
          type: integer
          minimum: 0
        code:
          type: string
        message:
          type: string
        details:
          type: [object, 'null']
          additionalProperties: true
    RevisionSet:
      type: object
      required: [sessionId, logicalRevision, indexRevision, persistedIdentity, persistedIdentityState]
      properties:
        sessionId:
          type: string
        logicalRevision:
          type: integer
          format: int64
          minimum: 0
        indexRevision:
          type: integer
          format: int64
          minimum: 0
        persistedIdentity:
          type: [string, 'null']
          description: Content fingerprint; null while background hashing is pending or failed.
        persistedIdentityState:
          type: string
          enum: [PENDING, READY, FAILED]
    ResultProvenance:
      type: object
      required: [completeness, revisions, diagnostics]
      properties:
        completeness:
          type: string
          enum: [COMPLETE, PARTIAL]
        revisions:
          $ref: '#/components/schemas/RevisionSet'
        diagnostics:
          type: array
          items:
            type: string
    Job:
      type: object
      required: [jobId, type, state, createdAt, startedAt, completedAt, deadlineAt, progress, sessionId, logicalRevision, sourceSnapshotId, diagnostics, result, completeness, error, cancellationReason]
      properties:
        jobId:
          type: string
          format: uuid
        type:
          type: string
          description: Internal typed operation name; no generic HTTP submission route exists.
        state:
          type: string
          enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, FAILED, CANCELLED]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        deadlineAt:
          type: [string, 'null']
          format: date-time
        sessionId:
          type: string
        logicalRevision:
          type: integer
          format: int64
          minimum: 0
        sourceSnapshotId:
          type: string
        progress:
          $ref: '#/components/schemas/JobProgress'
        result:
          type: [object, 'null']
          additionalProperties: true
          description: Bounded inline JSON result, present only after successful execution.
        completeness:
          type: [string, 'null']
          enum: [COMPLETE, PARTIAL, null]
          description: Analysis result completeness, independent of execution state.
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        diagnostics:
          type: array
          items:
            type: string
        cancellationReason:
          type: [string, 'null']
          enum: [USER, DEADLINE, SHUTDOWN, null]
    JobProgress:
      type: object
      required: [completed, total, stage]
      properties:
        completed:
          type: integer
          format: int64
          minimum: 0
        total:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Null when the amount of work is unknown.
        stage:
          type: string
    JobEvent:
      type: object
      required: [jobId, sequence, type, at, state, progress, resultUrl]
      properties:
        jobId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [job.queued, job.started, job.progress, job.cancel_requested, job.completed, job.failed, job.cancelled]
        at:
          type: string
          format: date-time
        state:
          type: string
          enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, FAILED, CANCELLED]
        progress:
          $ref: '#/components/schemas/JobProgress'
        resultUrl:
          type: string
          description: Poll this URL for the authoritative terminal result or error.
    FixedProject:
      type: object
      required: [inputs, dirty, revisions]
      properties:
        projectPath:
          type: [string, 'null']
        inputs:
          type: array
          items:
            type: string
        dirty:
          type: boolean
        revisions:
          $ref: '#/components/schemas/RevisionSet'
    SaveProjectRequest:
      type: object
      dependentRequired:
        expectedLogicalRevision: [expectedSessionId]
      properties:
        targetPath:
          type: string
          description: Existing project path or a new .jadx path for raw-input startup.
        expectedLogicalRevision:
          type: integer
          format: int64
          minimum: 0
        expectedSessionId:
          type: string
          format: uuid
    ReloadProjectRequest:
      type: object
      required: [discardUnsaved, expectedSessionId, expectedLogicalRevision]
      properties:
        discardUnsaved:
          type: boolean
        expectedSessionId:
          type: string
          format: uuid
        expectedLogicalRevision:
          type: integer
          format: int64
          minimum: 0
    PendingEdits:
      type: object
      required: [sessionId, logicalRevision, dirty, codeData]
      properties:
        sessionId:
          type: string
        logicalRevision:
          type: integer
          format: int64
        dirty:
          type: boolean
        codeData:
          type: object
          description: Native Jadx codeData JSON, including unrecognized fields.
          additionalProperties: true
        mappingsPath:
          type: [string, 'null']
          description: Current in-memory native mapping reference.
    ProjectSettings:
      type: object
      required: [mappingsPath, decompilationMode, revisions]
      properties:
        mappingsPath:
          type: [string, 'null']
          description: Native mapping reference; an accepted change remains dirty until explicit save.
        decompilationMode:
          type: string
          enum: [AUTO, RESTRUCTURE, SIMPLE, FALLBACK]
          description: Effective primary mode; this mode has no supported native persistence here.
        revisions:
          $ref: '#/components/schemas/RevisionSet'
    UpdateProjectSettingsRequest:
      type: object
      required: [mappingsPath, expectedSessionId, expectedLogicalRevision]
      properties:
        mappingsPath:
          type: [string, 'null']
        expectedLogicalRevision:
          type: integer
          format: int64
          minimum: 0
        expectedSessionId:
          type: string
          format: uuid
    Page:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
        complete:
          type: boolean
    Coverage:
      type: object
      required: [status, indexed, total]
      properties:
        status:
          type: string
          enum: [COMPLETE, PARTIAL]
        indexed:
          type: integer
          minimum: 0
        total:
          type: [integer, 'null']
          minimum: 0
    EditItem:
      type: object
      required: [kind, target, value]
      properties:
        kind:
          type: string
          enum: [RENAME_CLASS, RENAME_METHOD, RENAME_FIELD, COMMENT]
        target:
          type: object
          additionalProperties: true
        value:
          type: string
    ItemResult:
      type: object
      required: [index, status]
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [APPLIED, FAILED, SKIPPED]
        message:
          type: [string, 'null']

openapi: 3.1.0
info:
  title: LibJadx API
  version: 0.1.0-experimental
  summary: Local REST API for one fixed Jadx project per process.
  description: >-
    Experimental contract. A process opens one project or one or more input files
    at startup. There are no upload, project-open, or project-switch operations.
servers:
  - url: http://127.0.0.1:18777/api/v1
    description: Default loopback listener
tags:
  - name: Service
  - name: Project
  - name: Symbols
paths:
  /health/live:
    get:
      tags: [Service]
      operationId: getLiveness
      summary: Check whether the HTTP process is alive
      responses:
        '200':
          description: The process can serve HTTP requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /status:
    get:
      tags: [Service]
      operationId: getStatus
      summary: Read the fixed project's lifecycle and load progress
      responses:
        '200':
          description: Current lifecycle state, including LOADING and FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /capabilities:
    get:
      tags: [Service]
      operationId: getCapabilities
      summary: Read server and pinned-Jadx capability evidence
      responses:
        '200':
          description: Capability status is scoped to tested behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /shutdown:
    post:
      tags: [Service]
      operationId: shutdownService
      summary: Request graceful shutdown of this fixed-project process
      description: >-
        Omitted policy means discard. Active operations and nonterminal jobs
        return retryable PROJECT_BUSY without cancellation. refuse_if_dirty
        rejects unsaved edits without changing admission. save uses the native
        project path already established by startup or an explicit save and
        checks external changes before shutdown. The acknowledgment is sent
        before listener teardown; SIGKILL cannot guarantee persistence.
        A clearly cross-origin Origin returns INPUT_SECURITY_REJECTION.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShutdownRequest'
      responses:
        '202':
          description: Shutdown accepted; listener teardown follows the complete response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownAccepted'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '403':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          description: >-
            PROJECT_BUSY for active work or dirty refuse_if_dirty; active work
            includes bounded ShutdownBusyDetails in error.details. A native
            save conflict returns EXTERNAL_MODIFICATION_CONFLICT. For raw-input
            startup without an established native .jadx target, policy=save
            returns INVALID_REQUEST; first call /project/save with a targetPath.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            INTERNAL_ERROR if shutdown-save native I/O or runtime processing
            fails. When safely possible, the service remains READY with
            admissions reopened and pending edits retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ApiErrorResponse'
  /project:
    get:
      tags: [Project]
      operationId: getProject
      summary: Read the fixed project's native path, inputs, dirty state and revisions
      responses:
        '200':
          description: Current in-memory project state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedProject'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/save:
    post:
      tags: [Project]
      operationId: saveProject
      summary: Explicitly save native Jadx project data
      description: >-
        The targetPath is required for the first save after raw-input startup.
        The service checks the native project and mappings against their on-disk
        baselines before writing. Conflicting in-flight project operations fail
        promptly with HTTP 409 PROJECT_BUSY (retryable); they are not queued.
        Interrupted native writes may require a user backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectRequest'
      responses:
        '200':
          description: Native save completed and the file was fingerprinted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedProject'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/settings:
    get:
      tags: [Project]
      operationId: getProjectSettings
      summary: Read native mapping path and effective decompilation mode
      responses:
        '200':
          description: Current settings and revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
    patch:
      tags: [Project]
      operationId: updateProjectSettings
      summary: Stage a native mapping path and rebuild Jadx analysis
      description: >-
        The decompilation mode is temporary-only and cannot be persisted here.
        Conflicting in-flight project operations fail promptly with HTTP 409
        PROJECT_BUSY (retryable); they are not queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectSettingsRequest'
      responses:
        '200':
          description: Jadx was rebuilt and the native mapping path is staged in memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/reload:
    post:
      tags: [Project]
      operationId: reloadProject
      summary: Reload the same native project from disk
      description: >-
        The caller must provide the session and logical revision it observed.
        A stale precondition is rejected before any unsaved edit is discarded.
        Conflicting in-flight project operations fail promptly with HTTP 409
        PROJECT_BUSY (retryable); they are not queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadProjectRequest'
      responses:
        '200':
          description: Native project and Jadx analysis reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedProject'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /project/pending-edits/export:
    post:
      tags: [Project]
      operationId: exportPendingEdits
      summary: Return the current native code data without writing a file
      responses:
        '200':
          description: Transient in-memory code data snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEdits'
        'default':
          $ref: '#/components/responses/ApiErrorResponse'
  /classes:
    get:
      tags: [Symbols]
      operationId: listClasses
      summary: Page through currently Jadx-visible classes by original descriptor
      description: >-
        Includes eligible inner and anonymous classes by default. This is the
        current Jadx-visible set, not a census of every source definition.
        Original descriptors determine order; aliases never determine identity
        or default order. complete means this filtered visible enumeration is
        exhausted, while sourceCoverage=UNVERIFIED means discarded or merged
        input definitions cannot be ruled out. Cursors bind session, logical
        revision, engine publication and normalized filters. Busy work returns
        retryable PROJECT_BUSY; loading/reloading/shutdown returns 503. The
        signature is checked before cursor payload fields. A tampered cursor
        returns 400 INVALID_REQUEST; an authentic cursor from an older
        session/revision/publication returns 409 STALE_REVISION.
      parameters:
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: packagePrefix
          description: Exact original dotted package or its dot-delimited descendants.
          schema: { type: string, maxLength: 512 }
        - in: query
          name: nameContains
          description: Case-sensitive substring of the selected dotted qualified name.
          schema: { type: string, maxLength: 256 }
        - in: query
          name: nameDomain
          schema: { type: string, enum: [original, alias], default: original }
        - in: query
          name: includeInner
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: One bounded page of the filtered visible class set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassPage' }
              examples:
                firstPage:
                  externalValue: ./examples/classes-first-page.json
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /symbols/resolve:
    post:
      tags: [Symbols]
      operationId: resolveSymbol
      summary: Resolve an exact original class, method or field identity
      description: >-
        Well-formed domain misses and uncertain provenance return typed HTTP
        200 outcomes. A supplied inputIdentity cannot be selected unless exact
        per-input attribution is verified. Member lookup can load/decompile only
        the requested declaring class. No lookup saves or changes a revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SymbolResolveRequest' }
      responses:
        '200':
          description: RESOLVED, NOT_FOUND, AMBIGUOUS or PROVENANCE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SymbolResolution' }
              examples:
                classResolved: { externalValue: ./examples/class-resolved.json }
                methodResolved: { externalValue: ./examples/method-resolved.json }
                fieldResolved: { externalValue: ./examples/field-resolved.json }
                ambiguous: { externalValue: ./examples/symbol-ambiguous.json }
                provenanceUnavailable: { externalValue: ./examples/symbol-provenance-unavailable.json }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
        '415': { $ref: '#/components/responses/ApiErrorResponse' }
        '429': { $ref: '#/components/responses/ApiErrorResponse' }
        '503': { $ref: '#/components/responses/ApiErrorResponse' }
        '500': { $ref: '#/components/responses/ApiErrorResponse' }
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Service]
      operationId: getJob
      summary: Poll a retained process-local job
      description: Unknown, evicted, and expired IDs return 404; malformed UUIDs return 400. Polling never requires an SSE connection.
      responses:
        '200':
          description: Immutable current job snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Service]
      operationId: cancelJob
      summary: Request cooperative cancellation
      description: >-
        Idempotent. A queued job can become CANCELLED immediately. A running job
        remains CANCELLING until its work and owned cleanup actually cease. A
        clearly cross-origin request returns 403 INPUT_SECURITY_REJECTION.
      responses:
        '200':
          description: Current job snapshot after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '403':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
  /jobs/{jobId}/events:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Service]
      operationId: getJobEvents
      summary: Replay and follow bounded job events
      description: >-
        text/event-stream with numeric per-job IDs starting at 1. Events are
        job.queued, job.started, job.progress, job.cancel_requested,
        job.completed, job.failed, and job.cancelled. Omit Last-Event-ID to
        replay all retained events. A header older than retained history returns
        409 EVENT_HISTORY_EXPIRED before streaming; a future or malformed ID
        returns 400 INVALID_REQUEST. Clients may poll and reconnect without the
        stale ID. Comment heartbeats have no ID. Overflow disconnects the slow
        subscriber without cancelling the job. Terminal events close the stream.
        Unknown, evicted, or expired jobs return 404.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: SSE frames; each data line is a bounded JobEvent JSON object.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/JobResourceLimit'
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AcceptedJob:
      description: HTTP 202 contract for future asynchronous job-producing operations.
      headers:
        Location:
          required: true
          schema:
            type: string
            pattern: '^/api/v1/jobs/'
        X-Request-Id:
          schema:
            type: string
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Job'
    JobResourceLimit:
      description: HTTP 429 RESOURCE_LIMIT when the process-local queue or retention budget is exhausted.
      headers:
        X-Request-Id:
          schema:
            type: string
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApiErrorResponse:
      description: Structured API error.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Identifier for correlating this response with local service logs.
        Retry-After:
          schema:
            type: integer
          description: Present while the project is still loading; omitted for failed loads and shutdown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SymbolRef:
      type: object
      additionalProperties: false
      required: [kind, originalClassDescriptor]
      if:
        properties:
          kind: { enum: [METHOD, FIELD] }
        required: [kind]
      then:
        required: [originalName, originalDescriptor]
        properties:
          originalName: { type: string }
          originalDescriptor: { type: string }
      else:
        properties:
          originalName: { type: 'null' }
          originalDescriptor: { type: 'null' }
      properties:
        kind: { type: string, enum: [CLASS, METHOD, FIELD] }
        originalClassDescriptor:
          type: string
          maxLength: 1024
          pattern: '^L(?:[^./;\[\]<>\s]+/)*[^./;\[\]<>\s]+;$'
        inputIdentity: { type: [string, 'null'], maxLength: 256 }
        originalName: { type: [string, 'null'], maxLength: 512 }
        originalDescriptor: { type: [string, 'null'], maxLength: 2048 }
      description: >-
        Exact original JVM/DEX identity. CLASS omits member fields or carries
        null; METHOD and FIELD require non-null values for both. Class names use
        Lpackage/Top$Inner; with nonempty
        slash-delimited segments, no dots or array prefix. Method descriptors
        contain zero or more nonvoid field types in parentheses and one return
        type, which may be V. Field descriptors contain exactly one nonvoid
        type. No whitespace, generic syntax or normalization is accepted.
    SymbolInfo:
      type: object
      additionalProperties: false
      required: [ref, originalName, originalDescriptor, displayName, displayQualifiedName, provenance]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        originalName: { type: [string, 'null'] }
        originalDescriptor: { type: [string, 'null'] }
        displayName: { type: string }
        displayQualifiedName: { type: string }
        containingClass:
          oneOf:
            - { $ref: '#/components/schemas/SymbolRef' }
            - { type: 'null' }
        provenance: { type: string, enum: [EXACT, AMBIGUOUS, UNAVAILABLE] }
    ClassInfo:
      type: object
      additionalProperties: false
      required: [ref, originalDottedName, displayName, displayQualifiedName, isInner, codeAvailable, provenance]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        originalDottedName: { type: string }
        displayName: { type: string }
        displayQualifiedName: { type: string }
        isInner: { type: boolean }
        codeAvailable:
          type: boolean
          description: False when Jadx marks the class DONT_GENERATE, including inlined anonymous classes.
        originalParent:
          oneOf:
            - { $ref: '#/components/schemas/SymbolRef' }
            - { type: 'null' }
        provenance: { type: string, enum: [EXACT, AMBIGUOUS, UNAVAILABLE] }
    ClassPage:
      type: object
      additionalProperties: false
      required: [sessionId, logicalRevision, snapshotId, scope, sourceCoverage, items, nextCursor, complete]
      properties:
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        snapshotId: { type: string }
        scope: { const: JADX_VISIBLE }
        sourceCoverage: { const: UNVERIFIED }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ClassInfo' }
        nextCursor: { type: [string, 'null'], maxLength: 4096 }
        complete: { type: boolean }
    SymbolResolveRequest:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: { $ref: '#/components/schemas/SymbolRef' }
        expectedSessionId: { type: string, format: uuid }
        expectedLogicalRevision: { type: integer, format: int64, minimum: 0 }
      description: expectedSessionId and expectedLogicalRevision must occur together.
    SymbolResolution:
      type: object
      additionalProperties: false
      required: [outcome, queriedRef, sessionId, logicalRevision, snapshotId, candidates, diagnostics]
      properties:
        outcome: { type: string, enum: [RESOLVED, NOT_FOUND, AMBIGUOUS, PROVENANCE_UNAVAILABLE] }
        queriedRef: { $ref: '#/components/schemas/SymbolRef' }
        sessionId: { type: string, format: uuid }
        logicalRevision: { type: integer, format: int64, minimum: 0 }
        snapshotId: { type: string }
        symbol:
          oneOf:
            - { $ref: '#/components/schemas/SymbolInfo' }
            - { type: 'null' }
        candidates:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SymbolInfo' }
        diagnostics:
          type: array
          maxItems: 16
          items: { type: string }
    ShutdownRequest:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          enum: [discard, save, refuse_if_dirty]
          default: discard
    ShutdownAccepted:
      type: object
      required: [state, policy]
      additionalProperties: false
      properties:
        state:
          const: SHUTTING_DOWN
        policy:
          type: string
          enum: [discard, save, refuse_if_dirty]
    ShutdownBusyDetails:
      type: object
      required: [activeOperationCount, operations, activeJobCount, jobs]
      properties:
        activeOperationCount:
          type: integer
          minimum: 0
        operations:
          type: array
          maxItems: 16
          items:
            type: object
            required: [id, category, key]
            properties:
              id:
                type: string
                format: uuid
              category:
                type: string
              key:
                type: string
                maxLength: 128
        activeJobCount:
          type: integer
          minimum: 0
        jobs:
          type: array
          maxItems: 16
          items:
            type: object
            required: [jobId, state, type]
            properties:
              jobId:
                type: string
                format: uuid
              state:
                type: string
                enum: [QUEUED, RUNNING, CANCELLING]
              type:
                type: string
                maxLength: 128
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          const: ALIVE
    ServiceStatus:
      type: object
      required: [state, stage, progress, inputs]
      properties:
        state:
          type: string
          enum: [STARTING, LOADING, READY, RELOADING, FAILED, SHUTTING_DOWN, STOPPED]
        stage:
          type: string
          description: Active initialization or lifecycle stage.
        progress:
          $ref: '#/components/schemas/Progress'
        projectPath:
          type: [string, 'null']
          description: Native .jadx path when started from an existing native project.
        inputs:
          type: array
          items:
            type: string
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
    Progress:
      type: object
      required: [completed, total, unit]
      properties:
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        unit:
          type: string
    Capabilities:
      type: object
      required: [serverVersion, jadxVersion, capabilities]
      properties:
        serverVersion:
          type: string
        jadxVersion:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    Capability:
      type: object
      required: [name, status, evidence, persistence]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [SUPPORTED, PARTIAL, UNSUPPORTED, UNKNOWN]
        evidence:
          type: string
        precision:
          type: [string, 'null']
          enum: [EXACT, APPROXIMATE, UNKNOWN, UNAVAILABLE, null]
        persistence:
          type: string
          description: Persistence scope proven for the capability, or UNAVAILABLE.
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - PROJECT_NOT_READY
            - SERVICE_SHUTTING_DOWN
            - PROJECT_LOAD_FAILED
            - METHOD_NOT_ALLOWED
            - PROJECT_BUSY
            - EVENT_HISTORY_EXPIRED
            - INVALID_REQUEST
            - INVALID_ENTITY_ID
            - NOT_FOUND
            - UNSUPPORTED_CAPABILITY
            - INCOMPLETE_ANALYSIS
            - STALE_REVISION
            - EXTERNAL_MODIFICATION_CONFLICT
            - RESOURCE_LIMIT
            - CANCELLATION_PENDING
            - INPUT_SECURITY_REJECTION
            - INTERNAL_ERROR
            - OPERATION_NOT_IMPLEMENTED
          description: Stable machine-readable error code.
        message:
          type: string
        retryable:
          type: boolean
        requestId:
          type: [string, 'null']
        details:
          type: [object, 'null']
          additionalProperties: true
        causes:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        itemErrors:
          type: array
          items:
            $ref: '#/components/schemas/ItemError'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ItemError:
      type: object
      required: [index, code, message]
      properties:
        index:
          type: integer
          minimum: 0
        code:
          type: string
        message:
          type: string
        details:
          type: [object, 'null']
          additionalProperties: true
    RevisionSet:
      type: object
      required: [sessionId, logicalRevision, indexRevision, persistedIdentity, persistedIdentityState]
      properties:
        sessionId:
          type: string
        logicalRevision:
          type: integer
          format: int64
          minimum: 0
        indexRevision:
          type: integer
          format: int64
          minimum: 0
        persistedIdentity:
          type: [string, 'null']
          description: Content fingerprint; null while background hashing is pending or failed.
        persistedIdentityState:
          type: string
          enum: [PENDING, READY, FAILED]
    ResultProvenance:
      type: object
      required: [completeness, revisions, diagnostics]
      properties:
        completeness:
          type: string
          enum: [COMPLETE, PARTIAL]
        revisions:
          $ref: '#/components/schemas/RevisionSet'
        diagnostics:
          type: array
          items:
            type: string
    Job:
      type: object
      required: [jobId, type, state, createdAt, startedAt, completedAt, deadlineAt, progress, sessionId, logicalRevision, sourceSnapshotId, diagnostics, result, completeness, error, cancellationReason]
      properties:
        jobId:
          type: string
          format: uuid
        type:
          type: string
          description: Internal typed operation name; no generic HTTP submission route exists.
        state:
          type: string
          enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, FAILED, CANCELLED]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        deadlineAt:
          type: [string, 'null']
          format: date-time
        sessionId:
          type: string
        logicalRevision:
          type: integer
          format: int64
          minimum: 0
        sourceSnapshotId:
          type: string
        progress:
          $ref: '#/components/schemas/JobProgress'
        result:
          type: [object, 'null']
          additionalProperties: true
          description: Bounded inline JSON result, present only after successful execution.
        completeness:
          type: [string, 'null']
          enum: [COMPLETE, PARTIAL, null]
          description: Analysis result completeness, independent of execution state.
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        diagnostics:
          type: array
          items:
            type: string
        cancellationReason:
          type: [string, 'null']
          enum: [USER, DEADLINE, SHUTDOWN, null]
    JobProgress:
      type: object
      required: [completed, total, stage]
      properties:
        completed:
          type: integer
          format: int64
          minimum: 0
        total:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Null when the amount of work is unknown.
        stage:
          type: string
    JobEvent:
      type: object
      required: [jobId, sequence, type, at, state, progress, resultUrl]
      properties:
        jobId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [job.queued, job.started, job.progress, job.cancel_requested, job.completed, job.failed, job.cancelled]
        at:
          type: string
          format: date-time
        state:
          type: string
          enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, FAILED, CANCELLED]
        progress:
          $ref: '#/components/schemas/JobProgress'
        resultUrl:
          type: string
          description: Poll this URL for the authoritative terminal result or error.
    FixedProject:
      type: object
      required: [inputs, dirty, revisions]
      properties:
        projectPath:
          type: [string, 'null']
        inputs:
          type: array
          items:
            type: string
        dirty:
          type: boolean
        revisions:
          $ref: '#/components/schemas/RevisionSet'
    SaveProjectRequest:
      type: object
      dependentRequired:
        expectedLogicalRevision: [expectedSessionId]
      properties:
        targetPath:
          type: string
          description: Existing project path or a new .jadx path for raw-input startup.
        expectedLogicalRevision:
          type: integer
          format: int64
          minimum: 0
        expectedSessionId:
          type: string
          format: uuid
    ReloadProjectRequest:
      type: object
      required: [discardUnsaved, expectedSessionId, expectedLogicalRevision]
      properties:
        discardUnsaved:
          type: boolean
        expectedSessionId:
          type: string
          format: uuid
        expectedLogicalRevision:
          type: integer
          format: int64
          minimum: 0
    PendingEdits:
      type: object
      required: [sessionId, logicalRevision, dirty, codeData]
      properties:
        sessionId:
          type: string
        logicalRevision:
          type: integer
          format: int64
        dirty:
          type: boolean
        codeData:
          type: object
          description: Native Jadx codeData JSON, including unrecognized fields.
          additionalProperties: true
        mappingsPath:
          type: [string, 'null']
          description: Current in-memory native mapping reference.
    ProjectSettings:
      type: object
      required: [mappingsPath, decompilationMode, revisions]
      properties:
        mappingsPath:
          type: [string, 'null']
          description: Native mapping reference; an accepted change remains dirty until explicit save.
        decompilationMode:
          type: string
          enum: [AUTO, RESTRUCTURE, SIMPLE, FALLBACK]
          description: Effective primary mode; this mode has no supported native persistence here.
        revisions:
          $ref: '#/components/schemas/RevisionSet'
    UpdateProjectSettingsRequest:
      type: object
      required: [mappingsPath, expectedSessionId, expectedLogicalRevision]
      properties:
        mappingsPath:
          type: [string, 'null']
        expectedLogicalRevision:
          type: integer
          format: int64
          minimum: 0
        expectedSessionId:
          type: string
          format: uuid
    Page:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
        complete:
          type: boolean
    Coverage:
      type: object
      required: [status, indexed, total]
      properties:
        status:
          type: string
          enum: [COMPLETE, PARTIAL]
        indexed:
          type: integer
          minimum: 0
        total:
          type: [integer, 'null']
          minimum: 0
    EditItem:
      type: object
      required: [kind, target, value]
      properties:
        kind:
          type: string
          enum: [RENAME_CLASS, RENAME_METHOD, RENAME_FIELD, COMMENT]
        target:
          type: object
          additionalProperties: true
        value:
          type: string
    ItemResult:
      type: object
      required: [index, status]
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [APPLIED, FAILED, SKIPPED]
        message:
          type: [string, 'null']

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "libjadx"
version = "0.1.0a1"
description = "Typed sync/async HTTP SDK for the standalone local LibJadx Java service"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "OPENAPI-PYTHON-CLIENT-LICENSE", "THIRD_PARTY.md"]
dependencies = ["httpx>=0.28.1,<0.29", "attrs>=25.3,<27", "typing-extensions>=4.15,<5"]

[project.urls]
Source = "https://github.com/bostjanv/libjadx"

[dependency-groups]
dev = ["openapi-python-client==0.29.1", "ruff==0.16.9", "mypy==1.19.1", "pytest==8.4.2", "pytest-asyncio==1.2.0", "hatchling==1.27.0", "PyYAML==6.0.3", "jsonschema==4.26.0", "openapi-spec-validator==0.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/libjadx"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "tests", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "OPENAPI-PYTHON-CLIENT-LICENSE", "THIRD_PARTY.md", "generator.yaml"]

[tool.ruff]
target-version = "py311"
exclude = ["src/libjadx/_generated", "**/_generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["libjadx"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/libjadx/_generated"]

[[tool.mypy.overrides]]
module = ["libjadx._generated.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: launches installed Java distribution"]
